steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/touch-ocr-api-repo/easy-ocr-api', '.' ]
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push','us-central1-docker.pkg.dev/$PROJECT_ID/touch-ocr-api-repo/easy-ocr-api' ]
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      [
        'run', 'deploy', 'easy-ocr-api',
        '--image', 'us-central1-docker.pkg.dev/$PROJECT_ID/touch-ocr-api-repo/easy-ocr-api',
        '--platform', 'managed',
        '--region', 'us-central1',
        '--allow-unauthenticated',
        '--cpu', '2',
        '--memory', '8Gi',
        '--concurrency', '5',
        '--max-instances', '2'
      ]
options:
  logging: CLOUD_LOGGING_ONLY